name: SAST CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        run: apk add python3 py3-pip
      - name: Run Custom SAST Script
        run: python3 scripts/check_semgrep.py