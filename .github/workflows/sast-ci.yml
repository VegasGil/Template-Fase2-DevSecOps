name: SAST CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep (Javascript/Typescript)
        run: |
          semgrep --config=p/javascript --config=p/nodejs --severity=ERROR --error sample-app/